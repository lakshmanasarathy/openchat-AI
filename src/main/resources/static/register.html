<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Register - OpenChat AI</title>

    <link
        rel="stylesheet"
        href="css/register.css">

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="logo">
                O
            </div>

            <h1>Create account</h1>

            <p class="subtitle">
                Join OpenChat AI today
            </p>


            <form id="registerForm">

                <label>Full Name</label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required>


                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>


                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required>


                <label>Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required>


                <button
                    type="submit"
                    class="auth-button">

                    Create account

                </button>

            </form>


            <p id="message"></p>


            <div class="auth-link">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>

        </div>

    </div>


    <script src="js/register.js"></script>

</body>

</html>
