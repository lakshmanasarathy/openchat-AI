<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login - OpenChat AI</title>

    <link
        rel="stylesheet"
        href="css/login.css">

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="logo">
                O
            </div>

            <h1>Welcome back</h1>

            <p class="subtitle">
                Sign in to continue to OpenChat AI
            </p>


            <form id="loginForm">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>


                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required>


                <button
                    type="submit"
                    class="auth-button">

                    Login

                </button>

            </form>


            <p id="message"></p>


            <div class="auth-link">

                Don't have an account?

                <a href="register.html">
                    Create account
                </a>

            </div>

        </div>

    </div>


    <script src="js/login.js"></script>

</body>

</html>
